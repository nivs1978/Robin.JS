<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#071006">
	<title>The Adventures of Robin Hood</title>
	<style>
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071006; }
		body { display: grid; place-items: center; }
		canvas {
			display: block;
			width: min(100vw, 160vh);
			height: min(100vh, 62.5vw);
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			cursor: crosshair;
		}
		#fade-overlay {
			position: fixed;
			inset: 0;
			z-index: 1;
		display: block;
			background: #000;
			opacity: 1;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<canvas id="game" width="320" height="200" aria-label="The Adventures of Robin Hood"></canvas>
	<div id="fade-overlay" aria-hidden="true"></div>
	<script src="engine.js" defer></script>
	<script src="game.js?v=3" defer></script>
</body>
</html>
